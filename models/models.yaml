# Registry of exported EV segmentation models, read by inference/predict_models.py.
# weights paths are relative to the repo root. imgsz is the model's own inference size -- keep it.
# val_mask_map50_95 is each model's OWN val set (different sets, different sizes): not comparable across models.

models:
  v5_evnonev_y8m_20261029:
    weights: models/v5_evnonev_y8m_20261029/best.pt
    imgsz: 1440
    class_name: EV (0), non-EV (1; VLDL + non-EV)   # prediction lines carry the class id; summary.csv n_detections counts BOTH classes
    annotation: all membrane layers as separate polygons, collapsed to EV; VLDL/non-EV as a second class
    arch: yolov8m-seg, rect=False (mosaic + mixup on), overlap_mask=False, batch 8, fine-tuned from v4_y8m_20260924, ultralytics 8.4.94
    train_data: roboflow - 20261028 cryoai v5 S1 (114 train / 26 val / 39 test images; split balanced by session)
    val_mask_map50_95: 0.622   # 26 val images; inflated -- v4 init has seen 16 of them
    test_mask_map50_95: EV 0.708 / non-EV 0.508   # 39 S1 test images
    test_detection: EV F1=0.828 at conf 0.25, 0.868 at val-chosen conf; non-EV F1=0.827; lipo tiles EV F1 0.898 (v4_y8m 0.724)   # practical view
    test_roles: multilayer F1=0.868 inner-layer F1=0.842   # containment 0.99 / size ratio 0.75
    source_run: training outputs/roboflow_20261028_cryoai_v5_S1_evnonev/runs/2026-10-29_054810_y8m_1440_8b_300ep_Run_15
    note: Production candidate ("F5") per secondary analyses/v5_full_runs/RESULTS.md; use conf 0.50. Filter to class 0 before counting EVs. Small test set (5 lipo tiles); a batch-16 rerun is recommended before relying on it.

  v4_y8m_20260924:
    weights: models/v4_y8m_20260924/best.pt
    imgsz: 1440
    class_name: EV
    annotation: all membrane layers as separate polygons (multilayer recoverable via containment)
    arch: yolov8m-seg, rect, overlap_mask=False, batch 16, ultralytics 8.4.94
    train_data: roboflow - 20260924 cryoai v4 (100 train / 20 val / 50 test images; same labels as v3)
    val_mask_map50_95: 0.696   # 20 val images (same val set as v3)
    test_detection: P=0.819 R=0.889 F1=0.853 at conf 0.25; best F1 0.866 at conf 0.50   # 50 test images
    test_roles: multilayer F1=0.839 inner-layer F1=0.820   # containment 0.99 / size ratio 0.75
    source_run: training outputs/roboflow_20260924_cryoai_v4_singleclass/runs/2026-09-24_172246_y8m_1440_16b_300ep_Run_2
    note: Current best. Needs a GPU for routine use; see models/README.md for hardware and runtime.

  v4_y8n_20260924:
    weights: models/v4_y8n_20260924/best.pt
    imgsz: 1440
    class_name: EV
    annotation: all membrane layers as separate polygons (multilayer recoverable via containment)
    arch: yolov8n-seg, rect, overlap_mask=False, batch 24, ultralytics 8.4.94
    train_data: roboflow - 20260924 cryoai v4 (100 train / 20 val / 50 test images; same labels as v3)
    val_mask_map50_95: 0.684   # 20 val images (same val set as v3)
    test_detection: P=0.788 R=0.869 F1=0.826 at conf 0.25; best F1 0.843 at conf 0.45   # 50 test images
    test_roles: multilayer F1=0.734 inner-layer F1=0.732   # containment 0.99 / size ratio 0.75
    source_run: training outputs/roboflow_20260924_cryoai_v4_singleclass/runs/2026-09-24_134221_y8n_1440_24b_300ep_Run_1
    note: Lightweight option for CPU-only machines or quick passes; same data as v4_y8m.

  v3_run1_20260824:
    weights: models/v3_run1_20260824/best.pt
    imgsz: 1440
    class_name: EV
    annotation: all membrane layers as separate polygons (multilayer recoverable via containment)
    arch: yolov8n-seg, rect, overlap_mask=False, ultralytics 8.4.94
    train_data: roboflow - 20260824 cryoai v3 (51 train / 20 val / 99 test images)
    val_mask_map50_95: 0.666   # 20 val images
    test_detection: P=0.810 R=0.862 F1=0.835   # 99 test images
    note: Superseded by the v4 models. On the 50 v4 test images it scores F1 0.816 at conf 0.25, multilayer 0.667, inner-layer 0.657. Known issues - over-detects holey-carbon texture, sparse hallucinations on blank ice, misses small/faint EVs.

  allLayer_run14_20260713:
    weights: models/allLayer_run14_20260713/best.pt
    imgsz: 1440
    class_name: EV
    annotation: all membrane layers as separate polygons
    arch: yolov8n-seg, rect, overlap_mask=False, ultralytics 8.4.94
    train_data: roboflow - 20260713 all layer label (26 train / 5 val images)
    val_mask_map50_95: 0.691   # only 5 val images -- noisy
    note: First all-layer model; same config as v3 with half the training data. Baseline for the value of added data.

  yifei_202512:
    weights: models/yifei_202512/best.pt
    imgsz: 1024
    class_name: vesicle
    annotation: whole EVs only (outer boundary) -- no inner layers, so layer counting does not apply
    arch: yolov8n-seg, overlap_mask=True, ultralytics 8.3.36
    train_data: Yifei revised_annotation dataset, Dec 2025 (>100 images)
    val_mask_map50_95: 0.667   # Yifei's own val set
    note: Legacy EV-only detector. Its training images may overlap with the v3 dataset.
