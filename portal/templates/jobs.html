<style>
/* Jobs module (portal/modules/jobs.py). cj.css tokens only; every class is cj-jobs-*. Phone first. */
.cj-jobs{min-width:0}
.cj-jobs-lede{margin:0 0 6px}
.cj-jobs-flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.cj-jobs-flow{grid-template-columns:minmax(0,1fr)}}
.cj-jobs-col{display:flex;flex-direction:column;gap:10px}
.cj-main .cj-jobs-col h2.cj-sec.cj-jobs-colh{margin:14px 0 0;font-size:.78rem}
.cj-jobs-sub{font-weight:400;text-transform:none;letter-spacing:0}
.cj-jobs-dash{border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:.9rem;color:var(--mut);background:var(--card)}
.cj-jobs-cardx .cj-jobs-line{font-size:.85rem;overflow-wrap:anywhere}
.cj-jobs-cardx .cj-jobs-id{font-family:ui-monospace,Consolas,monospace;font-size:.72rem}
.cj-page a.cj-jobs-open{font-weight:600;font-size:.9rem}
.cj-jobs-more{margin:0;font-size:.85rem}
.cj-jobs-ai{display:inline-block;padding:0 6px;border-radius:999px;background:var(--accbg);color:var(--acc);font-size:.68rem;font-weight:700;line-height:1.5;vertical-align:1px}
.cj-page a.cj-jobs-unrec{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--warn);border-radius:10px;background:var(--warnbg);color:var(--warn);text-decoration:none;font-size:.85rem}
.cj-jobs-hwl{list-style:none;margin:0;display:flex;flex-wrap:wrap;gap:6px 28px;align-items:center}
.cj-jobs-hw{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font-size:.9rem}
.cj-jobs-hwlink{margin-left:auto;font-weight:600}
.cj-jobs-fin>summary{cursor:pointer;margin:20px 0 8px}
.cj-jobs-fin>summary .cj-sec{display:inline}
.cj-jobs-snap{margin:2px 0 8px}
.cj-jobs-banner{margin:0 0 10px;padding:8px 12px;border:1px solid var(--warn);border-left-width:4px;border-radius:8px;
  background:var(--warnbg);color:var(--fg);overflow-wrap:anywhere}
.cj-jobs-counts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.cj-page a.cj-jobs-count{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:4px 12px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);text-decoration:none;
  font-size:.88rem}
.cj-page a.cj-jobs-count:hover,.cj-page a.cj-jobs-count:focus-visible{border-color:var(--acc)}
.cj-page a.cj-jobs-count.cj-jobs-t-warn{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.cj-jobs-err{margin:6px 0}
.cj-jobs-sec{scroll-margin-top:12px;min-width:0}
.cj-main .cj-jobs-sec>h2.cj-sec{margin:20px 0 8px;font-size:.8rem}
.cj-jobs-n{display:inline-block;min-width:1.7em;padding:0 6px;border-radius:999px;background:var(--line);
  color:var(--fg);font-size:.75rem;text-align:center;letter-spacing:0}
.cj-jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.cj-jobs-item{display:flex;flex-direction:column;gap:6px}
.cj-jobs-att{border-left:3px solid var(--warn)}
.cj-jobs-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-width:0}
.cj-jobs-ttl,.cj-jobs-main{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
.cj-jobs-id{font-size:.75rem}
.cj-jobs-tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;flex:none;max-width:50%}
.cj-jobs-chip{flex:none;font-size:.75rem;font-weight:600;line-height:1.5;padding:1px 8px;border-radius:999px;
  border:1px solid transparent;white-space:nowrap}
.cj-jobs-chip.cj-jobs-t-run{background:var(--accbg);color:var(--acc)}
.cj-jobs-chip.cj-jobs-t-ok{background:var(--prodbg);color:var(--prod)}
.cj-jobs-chip.cj-jobs-t-warn{background:var(--warnbg);color:var(--warn)}
.cj-jobs-chip.cj-jobs-t-wait{border-color:var(--line);color:var(--mut)}
.cj-jobs-chip.cj-jobs-t-off{border:1px dashed var(--line);color:var(--mut)}
.cj-jobs-prog{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;font-size:.92rem}
.cj-jobs-bar{-webkit-appearance:none;appearance:none;display:block;width:100%;height:6px;border:0;border-radius:999px;
  background:var(--line);color:var(--acc);overflow:hidden}
.cj-jobs-bar::-webkit-progress-bar{background:var(--line);border-radius:999px}
.cj-jobs-bar::-webkit-progress-value{background:var(--acc);border-radius:999px}
.cj-jobs-bar::-moz-progress-bar{background:var(--acc);border-radius:999px}
.cj-jobs-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,130px),1fr));gap:4px 12px;margin:2px 0 0}
.cj-jobs-kv div{min-width:0}
.cj-jobs-kv dt{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.cj-jobs-kv dd{margin:0;font-size:.88rem;overflow-wrap:anywhere}
.cj-jobs-warn{margin:0;padding:6px 10px;border-radius:6px;border-left:3px solid var(--warn);background:var(--warnbg);
  color:var(--fg);font-size:.88rem;overflow-wrap:anywhere}
.cj-jobs-why{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
.cj-jobs-reason,.cj-jobs-hint{margin:0;font-size:.88rem}
.cj-jobs-tech{display:block;font-size:.75rem}
.cj-jobs-empty{margin:0}
.cj-jobs-machines{margin:0 0 8px}
.cj-jobs-rows{list-style:none;margin:0}
.cj-card.cj-jobs-rows{padding:0 12px}
.cj-jobs-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.cj-jobs-row:first-child{border-top:0}
.cj-jobs-pos{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:50%;background:var(--accbg);color:var(--acc);font-weight:700;font-size:.8rem}
.cj-jobs-pos.cj-jobs-t-off{background:transparent;color:var(--mut)}
.cj-jobs-foot{margin-top:20px}
.cj-jobs-act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:4px;min-width:0}
.cj-jobs-btn{min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--fg);font:inherit;font-size:.88rem;cursor:pointer}
.cj-jobs-btn:hover,.cj-jobs-btn:focus-visible{border-color:var(--acc)}
.cj-jobs-btn:disabled{opacity:var(--dim);cursor:default}
.cj-jobs-btn-warn{border-color:var(--warn);color:var(--warn)}
.cj-jobs-cf{display:flex;flex-direction:column;gap:8px;width:100%;padding:8px 10px;border:1px solid var(--warn);
  border-radius:8px;background:var(--warnbg)}
.cj-jobs-cf[hidden],.cj-jobs-res[hidden],.cj-jobs-btn[hidden]{display:none}
.cj-jobs-cq{margin:0;font-size:.88rem}
.cj-jobs-lbl{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--mut)}
.cj-jobs-in{min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);
  color:var(--fg);font:inherit;font-size:1rem;width:100%;box-sizing:border-box}
.cj-jobs-btns{display:flex;flex-wrap:wrap;gap:8px}
.cj-jobs-res{margin:0;font-size:.88rem;overflow-wrap:anywhere}
.cj-jobs-res-bad{color:var(--warn);font-weight:600}
</style>
<div class="cj-jobs" id="cj-jobs">
<h1>Jobs</h1>
<p class="cj-mut cj-jobs-lede">Data flows left to right. Each card opens its work. Updates every 30 s.</p>
<div id="cj-jobs-head">{{head}}</div>
<p id="cj-jobs-err" class="cj-mut cj-jobs-err" role="status" hidden></p>
<section class="cj-jobs-sec" id="cj-jobs-s-hardware" aria-label="Training hardware">{{hardware}}</section>
<div class="cj-jobs-flow">
<section class="cj-jobs-sec cj-jobs-col" id="cj-jobs-s-raw" aria-label="Raw uploads not converted">{{raw}}</section>
<section class="cj-jobs-sec cj-jobs-col" id="cj-jobs-s-converted" aria-label="Converted, no predictions yet">{{converted}}</section>
<section class="cj-jobs-sec cj-jobs-col" id="cj-jobs-s-review" aria-label="In review">{{review}}</section>
<section class="cj-jobs-sec cj-jobs-col" id="cj-jobs-s-datasets" aria-label="Datasets ready to train">{{datasets}}</section>
<section class="cj-jobs-sec cj-jobs-col" id="cj-jobs-s-training" aria-label="Training queued or running">{{training}}</section>
</div>
<section class="cj-jobs-sec" id="cj-jobs-s-attention" aria-labelledby="cj-jobs-h-attention">{{attention}}</section>
<section class="cj-jobs-sec" id="cj-jobs-s-finished" aria-label="Finished">{{finished}}</section>
<p class="cj-mut cj-jobs-foot">This page refreshes every 30 s.</p>
</div>
<script src="/jobs/jobs.js" defer></script>
